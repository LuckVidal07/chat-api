info:
  name: criarConversa
  type: http

http:
  method: POST
  url: http://localhost/api/conversations
  body:
    type: json
    data: |-
      {
        "name": "Grupo Laravel",
        "description": "Conversa para estudar Laravel"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
